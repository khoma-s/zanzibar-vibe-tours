<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viaggi e tour a Zanzibar in italiano | Zanzibar Vibe Tours</title>
    <meta name="description" content="Scopri Zanzibar con tour, soggiorni e assistenza in italiano. Esplora le nostre proposte a Matemwe e organizza il tuo viaggio con Zanzibar Vibe Tours." />
    <meta name="author" content="Zanzibar Vibe Tours" />
    
    <!-- Language detection script - runs before React to set correct lang attribute -->
    <script>
      (function() {
        var savedLang = localStorage.getItem('zv_lang');
        var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        var pathLang = window.location.pathname.match(/^\/(it|pl)(?:\/|$)/);
        var lang = pathLang ? pathLang[1] : (savedLang || (browserLang.startsWith('it') ? 'it' : 'pl'));
        document.documentElement.lang = lang;
      })();
    </script>
    
    <!-- Open Graph -->
    <meta property="og:title" content="Viaggi e tour a Zanzibar in italiano | Zanzibar Vibe Tours" />
    <meta property="og:description" content="Scopri Zanzibar con tour, soggiorni e assistenza in italiano. Esplora le nostre proposte a Matemwe e organizza il tuo viaggio con Zanzibar Vibe Tours." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="pl_PL" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Hreflang (will be updated dynamically by React) -->
    <link rel="alternate" hreflang="it" href="https://zanzibar-vibetours.eu/it/" />
    <link rel="alternate" hreflang="pl" href="https://zanzibar-vibetours.eu/pl/" />
    <link rel="alternate" hreflang="x-default" href="https://zanzibar-vibetours.eu/it/" />
    <link rel="canonical" href="https://zanzibar-vibetours.eu/it/" />
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      /* Prevent FOUC */
      #root { min-height: 100vh; }
      .initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background-color: #FBF3D5; z-index: 99999; transition: opacity 0.3s;
      }
      .initial-loader.hidden { opacity: 0; pointer-events: none; }
      .initial-loader .spinner {
        width: 48px; height: 48px; border: 4px solid #2AAFB5; border-top-color: transparent;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initialLoader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
